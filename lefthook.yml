# Git hooks for the LibraSearch repository.
pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,mjs,ts,tsx,json,jsonc,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - name: typecheck
      glob: "*.{ts,tsx}"
      run: pnpm exec next typegen > /dev/null && pnpm exec tsc --noEmit

commit-msg:
  jobs:
    - name: message
      run: node scripts/check-commit-msg.mjs {1}
